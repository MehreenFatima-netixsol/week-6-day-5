<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFL Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --turf:#173B2E;
    --turf-dark:#0E271F;
    --chalk:#F4F1E8;
    --sherrin:#B5432C;
    --ochre:#D9A441;
    --line: rgba(244,241,232,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(ellipse 140% 90% at 50% -10%, #1E4A39 0%, var(--turf) 45%, var(--turf-dark) 100%);
    font-family:'Archivo', sans-serif;
    color:var(--chalk);
    display:flex; flex-direction:column; align-items:center;
  }
  .field-lines{
    position:fixed; inset:0; pointer-events:none; opacity:0.05;
    background-image:
      repeating-linear-gradient(0deg, var(--chalk) 0 1px, transparent 1px 90px);
  }
  header{
    width:100%; max-width:760px; padding:28px 20px 14px;
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .brand{display:flex; align-items:baseline; gap:12px;}
  .brand .mark{
    font-family:'Archivo Black', sans-serif; font-size:1.9rem; letter-spacing:-0.02em;
  }
  .brand .mark span{color:var(--ochre);}
  .brand .tag{
    font-family:'JetBrains Mono', monospace; font-size:0.68rem; color:var(--chalk);
    opacity:0.55; letter-spacing:0.06em; text-transform:uppercase;
  }
  .coverage{
    font-family:'JetBrains Mono', monospace; font-size:0.68rem; opacity:0.5; text-align:right;
    line-height:1.5;
  }
  main{
    width:100%; max-width:760px; flex:1; padding:6px 20px 140px;
    display:flex; flex-direction:column; gap:14px;
  }
  .msg{max-width:82%; animation:rise 0.25s ease-out;}
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .msg.user{align-self:flex-end;}
  .msg.bot{align-self:flex-start;}
  .bubble{
    padding:13px 16px; border-radius:3px; line-height:1.5; font-size:0.96rem;
    border-left:3px solid transparent;
  }
  .msg.user .bubble{
    background:var(--sherrin); color:var(--chalk); border-left-color:var(--ochre);
  }
  .msg.bot .bubble{
    background:rgba(244,241,232,0.06); border:1px solid var(--line); border-left:3px solid var(--ochre);
  }
  .meta{
    margin-top:5px; font-family:'JetBrains Mono', monospace; font-size:0.65rem;
    opacity:0.45; display:flex; gap:10px; flex-wrap:wrap; padding-left:2px;
  }
  .meta b{color:var(--ochre); opacity:1; font-weight:600;}
  .pred-card{
    margin-top:8px; padding:10px 12px; background:rgba(217,164,65,0.08);
    border:1px dashed var(--ochre); border-radius:3px; font-family:'JetBrains Mono', monospace;
    font-size:0.72rem; line-height:1.6;
  }
  .pred-bar-track{
    width:100%; height:20px; border-radius:10px; overflow:hidden; display:flex;
    background:rgba(255,255,255,0.08); margin:8px 0 4px;
  }
  .pred-bar-home{ background:var(--ochre); display:flex; align-items:center; padding-left:8px; }
  .pred-bar-away{ background:var(--sherrin); display:flex; align-items:center; justify-content:flex-end; padding-right:8px; }
  .pred-bar-text{ font-family:'JetBrains Mono', monospace; font-size:0.68rem; font-weight:700; color:var(--turf-dark); }
  .pred-bar-text.away{ color:var(--chalk); }
  .pred-disclaimer{ font-size:0.7rem; font-style:italic; opacity:0.75; margin-top:6px; }
  .composer{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; justify-content:center;
    background:linear-gradient(0deg, var(--turf-dark) 55%, transparent);
    padding:22px 20px 26px;
  }
  form{
    width:100%; max-width:760px; display:flex; gap:10px;
    background:rgba(244,241,232,0.07); border:1px solid var(--line);
    border-radius:4px; padding:6px;
  }
  input{
    flex:1; background:transparent; border:none; outline:none; color:var(--chalk);
    padding:12px 10px; font-family:'Archivo', sans-serif; font-size:0.95rem;
  }
  input::placeholder{color:rgba(244,241,232,0.4);}
  button{
    background:var(--ochre); color:var(--turf-dark); border:none; border-radius:2px;
    padding:0 22px; font-family:'Archivo Black', sans-serif; font-size:0.85rem;
    letter-spacing:0.02em; cursor:pointer; transition:transform 0.1s ease;
  }
  button:hover{transform:translateY(-1px);}
  button:disabled{opacity:0.4; cursor:default; transform:none;}
  .quick{
    display:flex; gap:8px; flex-wrap:wrap; margin:2px 0 4px;
  }
  .quick button{
    background:transparent; color:var(--chalk); border:1px solid var(--line);
    padding:7px 12px; font-family:'JetBrains Mono', monospace; font-size:0.7rem;
    border-radius:20px; opacity:0.75;
  }
  .quick button:hover{border-color:var(--ochre); color:var(--ochre); opacity:1;}
  .empty{
    opacity:0.5; font-family:'JetBrains Mono', monospace; font-size:0.8rem; padding:20px 0;
  }
  .status-dot{
    width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px;
    background:#8FBF9F;
  }
  .status-dot.off{background:var(--sherrin);}
</style>
</head>
<body>
<div class="field-lines"></div>
<header>
  <div class="brand">
    <div class="mark">AFL <span>ANALYST</span></div>
    <div class="tag">langgraph capstone // demo</div>
  </div>
  <div class="coverage">
    <div><span id="statusDot" class="status-dot off"></span><span id="statusText">checking api...</span></div>
    <div>matches 1983&ndash;2025 &middot; players 1999&ndash;2025</div>
  </div>
</header>

<main id="thread">
  <div class="empty">Ask about a club's recent form, a head-to-head record, or predict an upcoming match. Try a suggestion below &darr;</div>
</main>

<div class="composer">
  <div style="width:100%; max-width:760px; display:flex; flex-direction:column; gap:10px;">
    <div class="quick">
      <button type="button" data-q="How many teams are in the AFL?">how many teams?</button>
      <button type="button" data-q="What were the Cats stats last round?">Cats last round</button>
      <button type="button" data-q="Who will win Geelong vs Carlton on 2015-05-10?">predict Geelong vs Carlton</button>
      <button type="button" data-q="Show me the AFL ladder for 2015">2015 ladder</button>
      <button type="button" data-q="What's the capital of France?">off-topic test</button>
    </div>
    <form id="chatForm">
      <input id="msgInput" type="text" placeholder="Ask AFL Analyst something..." autocomplete="off"/>
      <button type="submit" id="sendBtn">SEND</button>
    </form>
  </div>
</div>

<script>
const API_BASE = window.location.hash.replace('#','') || 'http://localhost:8000';
let conversationId = null;
const thread = document.getElementById('thread');
const form = document.getElementById('chatForm');
const input = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

async function checkHealth(){
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  try{
    const r = await fetch(API_BASE + '/health');
    if(r.ok){ dot.classList.remove('off'); txt.textContent = 'api connected'; }
    else throw new Error();
  }catch(e){
    dot.classList.add('off');
    txt.textContent = 'api offline (start uvicorn api:app)';
  }
}
checkHealth();

function clearEmpty(){
  const empty = thread.querySelector('.empty');
  if(empty) empty.remove();
}

function addMessage(role, text, metaHtml, predCard){
  clearEmpty();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  if(predCard){
    const card = document.createElement('div');
    card.className = 'pred-card';
    card.innerHTML = predCard;
    wrap.appendChild(card);
  }
  if(metaHtml){
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = metaHtml;
    wrap.appendChild(meta);
  }
  thread.appendChild(wrap);
  window.scrollTo(0, document.body.scrollHeight);
}

async function sendMessage(text){
  if(!text.trim()) return;
  addMessage('user', text);
  input.value = '';
  sendBtn.disabled = true;
  try{
    const res = await fetch(API_BASE + '/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:text, conversation_id: conversationId})
    });
    if(!res.ok){ throw new Error('HTTP ' + res.status); }
    const data = await res.json();
    conversationId = data.conversation_id;
    let meta = `<span><b>intent</b> ${data.intent}</span><span><b>latency</b> ${data.latency_ms}ms</span>`;
    if(data.tools_called && data.tools_called.length){
      meta += `<span><b>tools</b> ${data.tools_called.join(', ')}</span>`;
    }
    if(data.needs_clarification){
      meta += `<span><b>status</b> awaiting clarification</span>`;
    }
    let predCard = null;
    if(data.prediction_metadata){
      const m = data.prediction_metadata;
      if(m.home_win_probability_pct !== undefined){
        const hp = m.home_win_probability_pct, ap = m.away_win_probability_pct;
        predCard = `
          <div>${m.home_team} vs ${m.away_team} &mdash; win probability</div>
          <div class="pred-bar-track">
            <div class="pred-bar-home" style="width:${hp}%"><span class="pred-bar-text">${hp.toFixed(1)}%</span></div>
            <div class="pred-bar-away" style="width:${ap}%"><span class="pred-bar-text away">${ap.toFixed(1)}%</span></div>
          </div>
          <div>model: ${m.model || 'n/a'}</div>
          <div class="pred-disclaimer">&#9888; ${m.disclaimer || 'This is a predicted probability, not a certainty.'}</div>`;
      } else if(m.ranking && m.ranking.length){
        const maxVal = Math.max(...m.ranking.map(r => r.predicted_value)) || 1;
        const bars = m.ranking.slice(0,5).map(r => {
          const pct = (r.predicted_value / maxVal * 100).toFixed(1);
          return `<div style="margin:5px 0;">${r.player_name} &mdash; ${r.predicted_value}
            <div class="pred-bar-track" style="height:12px;">
              <div class="pred-bar-home" style="width:${pct}%"></div>
            </div></div>`;
        }).join('');
        predCard = `<div>Predicted ${m.stat_type} leader &mdash; ${m.team}</div>${bars}
          <div>model: ${m.model || 'n/a'}</div>
          <div class="pred-disclaimer">&#9888; ${m.disclaimer || 'This is a predicted estimate, not a certainty.'}</div>`;
      }
    }
    addMessage('bot', data.response, meta, predCard);
  }catch(err){
    addMessage('bot', 'Could not reach the AFL Analyst API. Is uvicorn running at ' + API_BASE + '?', null, null);
  }finally{
    sendBtn.disabled = false;
    checkHealth();
  }
}

form.addEventListener('submit', (e)=>{
  e.preventDefault();
  sendMessage(input.value);
});

document.querySelectorAll('.quick button').forEach(btn=>{
  btn.addEventListener('click', ()=> sendMessage(btn.dataset.q));
});
</script>
</body>
</html>
